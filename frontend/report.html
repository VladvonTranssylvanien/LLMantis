<style>
/* ---- primitives lifted from assets/base.css (tokens stripped) ---- */
/* ===========================================================================
   LLMantis — shared foundation
   ---------------------------------------------------------------------------
   Fonts, tokens and primitives for all three pages. Served from our own
   origin: no CDN, no Google Fonts, no external request of any kind.
   PLAYBOOK.md §3 is the source of truth for every value here.
   =========================================================================== */

/* --------------------------------------------------------------- typefaces */
/* Self-hosted. `font-display: swap` so text paints immediately in the
   fallback and reflows once the file lands, rather than blocking on it. */
@font-face {
  font-family: 'Inter';
  src: url('assets/fonts/InterVariable.woff2') format('woff2-variations');
  font-weight: 100 900;          /* one variable file covers the whole ramp */
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'JetBrains Mono';
  src: url('assets/fonts/JetBrainsMono-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'JetBrains Mono';
  src: url('assets/fonts/JetBrainsMono-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

/* ------------------------------------------------------------- dark tokens */


/* ------------------------------------------------- light tokens: the paper */
/* The Prüfbericht is the one printed surface. Every value below is measured
   against #FFFFFF and against the #F6F7F8 wash, and clears WCAG AA (4.5:1)
   for small text — the report is read, not glanced at. */


/* ------------------------------------------------------------- primitives */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; letter-spacing: -0.03em; text-wrap: balance; }
.mono { font-family: var(--mono); }

/* One visible focus style everywhere. Never remove it without a replacement. */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}
[data-surface='paper'] :focus-visible { outline-color: var(--accent-on-light); }

.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--glass-border);
  /* NOT `var(--glass-shine), var(--glass-lift)`. box-shadow's grammar is
     `none | <shadow>#` — `none` is legal only as the SOLE value, so the pair
     failed to parse and the WHOLE declaration was dropped: .glass computed
     box-shadow:none on every page, and nobody noticed because the hairline
     border stayed. Measured in Chrome: shine+lift -> "none", lift alone ->
     "rgba(18,18,16,.18) 0 8px 24px -14px". If a token can hold `none`, it
     cannot sit in a comma list. */
  box-shadow: var(--glass-lift);
}
/* Without this a browser with no backdrop-filter paints a see-through panel
   and the text behind shows through the text on top. Opaque is safe failure. */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-fallback); }
}

.btn {
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: var(--on-accent);
  background: var(--accent);
  text-decoration: none;
  border: 0;
  border-radius: 9px;
  padding: 10px 18px;
  display: inline-block;
  transition: filter .2s var(--ease), transform .2s var(--ease);
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; }
.btn--ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn--ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }

/* Screen-reader-only, for labels that must exist but not be seen. */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* PLAYBOOK §3 makes this mandatory on every page. */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

:root{
  /* This block is copied verbatim into all SIX pages: index, scanner, report,
     impressum, datenschutz, art50check. That duplication is why the app and
     the landing drifted into two palettes in the first place: a colour changed
     in one file only. Change it in all six, and keep them byte-identical:
       for f in index scanner report impressum datenschutz art50check; do
         awk '/^:root\{/,/^\}/' frontend/$f.html | md5; done   # one hash
     art50check.html was the last page to join, and it joined by dropping its
     <link> to assets/base.css — which nothing loads any more. */
  --bg:#F2F1EB;            /* the landing's ground. The app's own was #F7F8F5,
                              1.06 away — the swap is a hue move, not a weight
                              move, so no AA threshold turns over on it.      */
  --bg-2:#FFFFFF;
  --surface:#FFFFFF;       /* 1.13 off the ground; on #F7F8F5 it was 1.07       */
  /* Recessed track/hover, and it has two grounds: the .ring track and
     .fhead:hover sit on --surface (#FFFFFF), while .pbar, .mini and the nav
     hover sit on the page ground. Those two weights can no longer both be
     held. #EEF6E9 was 1.037 off the OLD ground and 1.106 off white; the new
     ground is itself 1.132 off white, i.e. darker than that old track — so
     nothing that still reads as recessed against the ground can also be
     1.106 off white. The role wins: 1.034 off the ground, and 1.171 off
     white, where it reads slightly heavier than it used to.               */
  --surface-2:#ECEEE6;
  --border:#DFDED9;        /* 1.19 off the ground. #E3E6DF was 1.18 on the old
                              ground and only 1.12 on this one — the hairline
                              lost a fifth of its separation to the swap.       */
  --text:#121210;          /* 16.57:1                                          */
  --muted:#5A6660;         /*  5.30:1  AA. The landing's #706E63 measures 4.53
                              here — 0.03 above the threshold, for no gain.    */

  /* One value has to serve two roles: green text on the page, and a button
     fill carrying a white label. #116B2E is 5.86:1 as text on --bg and 6.63:1
     the other way round, so both clear AA and there is no second green. */
  --accent:#116B2E;
  --on-accent:#FFFFFF;
  --accent-on-light:#116B2E;   /* the same green. See the paper block below.    */

  --critical:#A3200F;      /*  6.70:1 */
  --high:#B45309;          /*  4.44:1 on the ground — but it is never small
                              text there: as a grade it is 34px, as a severity
                              it sits on --surface (5.02:1), and its one use on
                              the ground is a 1px border, where 3:1 applies. */
  --medium:#7A5200;        /*  6.12:1 */
  --low:#27548F;           /*  6.75:1 */
  --info:#5A6660;

  /* #7BE33F is 1.5:1 on white. It survives only as a large decorative shape,
     never as text, an icon, or a border on its own — and since the warm bloom
     went orange nothing references it. Kept as the dark theme's brand green. */
  --brand-lite:#7BE33F;

  --grid-line:rgba(18,18,16,.045);
  /* The warm bloom was #7BE33F at .16, which blends to #DFEFCF — a cold lime
     patch on a warm ground. It is now the landing's one warm note, #FF720D,
     at the alpha that reproduces the old bloom's weight (1.06 off the ground). */
  --bloom-warm:rgba(255,114,13,.067);
  --bloom-cool:rgba(17,107,46,.05);

  /* Chrome that overlays scrolling content keeps the material; on a light
     ground the inset shine reads as a smudge, so it is dropped. */
  --glass-bg:rgba(242,241,235,.86);
  --glass-border:#DFDED9;
  --glass-lift:0 8px 24px -14px rgba(18,18,16,.18);
  --glass-fallback:#FFFFFF;

  --ring:rgba(17,107,46,.30);
  --ease:cubic-bezier(0.16,1,0.3,1);
  --r:12px;
  /* The landing's two chrome values, so the header ported from it is the same
     object here and not a lookalike: --pad is the page gutter the header and
     the overlay both sit on, --dur the transition the overlay slides with.
     --ease above is already the landing's --ease-expo, same curve. */
  --pad:clamp(20px,4.4vw,64px);
  --dur:.35s;
  /* Header height, so body padding and scroll-padding agree with the bar.
     It lives HERE and not in a :root of its own next to the header rules: a
     second `:root{` at column 0 opened a second range in the awk check this
     block documents below, and the check went from one hash to four. The
     detector broke, not the palette. */
  --hdr:110px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--sans)}

/* The printed sheet is its own surface. base.css defines these under
   [data-surface='paper'] — dropping the shared stylesheet dropped them with it,
   and an undefined custom property resolves to nothing rather than to a
   fallback: .printbar lost its background and kept its white text. */
[data-surface='paper']{
  --paper:#FFFFFF;
  --wash:#F6F7F8;
  --ink:#121210;          /* 16.57:1 on --bg, 18.75:1 on white */
  --ink-soft:#5A6660;     /*  5.99:1 on white */
  --rule:#E3E6DF;
  --accent-on-light:#116B2E;  /* 6.63:1 on white, 6.18:1 on the wash. Was
                                 #1F5C0E at 8.09 — a second green, one hue
                                 step off the screen one and visible when the
                                 report opens out of the app. */
  --critical:#A3200F;
  --high:#B45309;
  --medium:#7A5200;
  --low:#27548F;
  --on-accent:#FFFFFF;
  --ring:rgba(17,107,46,.30);
}

/* ── STEP 1 — the dated stamp. It states that a test happened, when, and under
   which reference. It never states a verdict: the grade lives in the grade
   card. A seal carrying a grade would be a rating mark. ─────────────────── */
.stamp{float:right;width:36mm;text-align:center;transform:rotate(-4deg);
  margin:2mm 0 6mm 8mm;opacity:.9}
.stamp img{width:27mm;display:block;margin:0 auto 2.5mm;opacity:.92}
.stamp .ref{font-family:var(--mono);font-size:6.5pt;line-height:1.55;
  color:var(--accent-on-light);letter-spacing:.01em}
@media print{ .stamp{opacity:1} }
@media (max-width:900px){ .stamp{float:none;transform:none;margin:0 auto 8mm} }

/* STEP 9 — neither page carried this. The prompt named only report.html;
   index.html was missing it too. */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
<style>
/* ===========================================================================
   LLMantis — Prüfbericht (test report)
   ---------------------------------------------------------------------------
   The one printed surface, so it is light-themed on purpose. The paper tokens
   are INLINE below, not from assets/base.css — that file still holds the dark
   set and a [data-surface='paper'] block whose values differ from these. Every
   paper token that carries small text clears WCAG AA (4.5:1) against both
   #FFFFFF and the #F6F7F8 wash.

   Export is print-to-PDF. No PDF library and no external service: that is P2
   in docs/VLAD-IMPLEMENTATION-PLAN.md, not this session.
   =========================================================================== */

@page { size: A4; margin: 16mm 15mm 18mm; }

body {
  background: var(--wash);
  color: var(--ink);
  font-size: 10.5pt;
  line-height: 1.55;
}
.sheet {
  max-width: 210mm; margin: 0 auto; background: var(--paper);
  padding: 16mm 15mm 18mm;
  box-shadow: 0 2px 24px rgba(0,0,0,.09);
}

/* --------------------------------------------------------- running header */
/* Chrome repeats a position:fixed element on every printed page, which is how
   the lockup and the target name reach page 2 onward. */
.runhead {
  display: none;
  font-size: 8pt; color: var(--ink-soft);
  border-bottom: .5pt solid var(--rule);
  padding-bottom: 3mm;
}
.runhead .r { float: right; }

/* ------------------------------------------------------------------ masthead */
.masthead {
  display: flex; align-items: center; gap: 11px;
  padding-bottom: 13px; border-bottom: 2px solid var(--ink);
}
.masthead img { width: 26px; height: 26px; display: block; }
.masthead .name { font-size: 14pt; font-weight: 600; letter-spacing: -0.02em; }
.masthead .name .ll { color: var(--accent-on-light); }
.masthead .kind {
  margin-left: auto; font-family: var(--mono); font-size: 8pt;
  letter-spacing: .13em; text-transform: uppercase; color: var(--ink-soft);
}

.title { margin-top: 20px; }
.title h1 { font-size: 22pt; line-height: 1.12; }
.title .sub { color: var(--ink-soft); margin: 7px 0 0; font-size: 11pt; }

.meta {
  display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 20px;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.meta div { padding: 10px 12px 10px 0; }
.meta dt {
  font-family: var(--mono); font-size: 7.5pt; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-soft); margin: 0 0 3px;
}
.meta dd { margin: 0; font-size: 9.5pt; font-variant-numeric: tabular-nums; word-break: break-word; }

/* ---------------------------------------------------------------- verdict */
.verdict {
  display: flex; align-items: center; gap: 24px; margin-top: 24px;
  padding: 19px 21px; background: var(--wash); border: 1px solid var(--rule);
  border-radius: 6px; break-inside: avoid;
}
.gradebox {
  width: 72px; height: 72px; border-radius: 8px; display: grid; place-items: center;
  flex: none; color: #fff;
}
.gradebox span { font-size: 32pt; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
.vnum { font-size: 20pt; font-weight: 700; letter-spacing: -0.03em; }
.vnum small { font-size: 11pt; font-weight: 400; color: var(--ink-soft); }
.vstats { display: flex; gap: 24px; margin-top: 9px; flex-wrap: wrap; }
.vstats b { display: block; font-size: 13pt; font-variant-numeric: tabular-nums; }
.vstats span {
  font-family: var(--mono); font-size: 7.5pt; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-soft);
}
.nograde { border-color: var(--medium); background: #FFF8E5; }
.nograde .vnum { color: var(--medium); }

/* --------------------------------------------------------------- sections */
section { margin-top: 28px; }
h2.sec {
  font-size: 12.5pt; padding-bottom: 6px;
  border-bottom: 1px solid var(--rule); margin-bottom: 13px;
}
p { margin: 0 0 10px; }
p.soft { color: var(--ink-soft); }

table { border-collapse: collapse; width: 100%; font-size: 9.5pt; }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th {
  font-family: var(--mono); font-size: 7.5pt; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-soft); font-weight: 500;
}
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* --------------------------------------------------------------- findings */
.finding {
  border: 1px solid var(--rule); border-left: 3px solid var(--rule);
  border-radius: 5px; padding: 14px 16px; margin-bottom: 11px;
  break-inside: avoid; page-break-inside: avoid;
}
.fhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sev {
  font-family: var(--mono); font-size: 7.5pt; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 7px; border: 1px solid currentColor; border-radius: 3px;
}
.conf {
  font-family: var(--mono); font-size: 7.5pt; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-soft);
  border: 1px solid var(--rule); border-radius: 3px; padding: 2px 7px;
}
.fid { margin-left: auto; font-family: var(--mono); font-size: 8pt; color: var(--ink-soft); }
.finding h3 { font-size: 11pt; margin: 9px 0 0; font-weight: 600; }
.kv { margin-top: 10px; }
.kv dt {
  font-family: var(--mono); font-size: 7.5pt; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px;
}
.kv dd { margin: 0 0 10px; }
pre {
  margin: 0; font-family: var(--mono); font-size: 8.5pt; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word;
  background: var(--wash); border: 1px solid var(--rule); border-left: 2px solid var(--rule);
  border-radius: 4px; padding: 9px 11px;
}
pre.evidence { border-left-color: var(--critical); background: #FDF3F3; }
/* #F2F8EE was a tint of the retired #1F5C0E. Same weight off white (1.08),
   mixed from the green that is actually on the border now. */
pre.fix { border-left-color: var(--accent-on-light); background: #F3F7F4; }

.compact { font-size: 9.5pt; margin: 0; padding-left: 18px; }
.compact li { margin-bottom: 3px; }

.withheld {
  margin-top: 12px; padding: 11px 13px; border: 1px solid var(--rule);
  border-left: 3px solid var(--medium); border-radius: 5px;
  font-size: 9pt; color: var(--ink-soft); break-inside: avoid;
}

/* ------------------------------------------------------------- disclaimer */
.disclaimer {
  margin-top: 30px; padding: 15px 17px; border: 1px solid var(--ink);
  border-radius: 5px; font-size: 9pt; break-inside: avoid; page-break-inside: avoid;
}
.disclaimer h2 { font-size: 10.5pt; margin-bottom: 8px; }
.disclaimer p { margin-bottom: 8px; }
.disclaimer p:last-child { margin-bottom: 0; }

footer.doc {
  margin-top: 24px; padding-top: 10px; border-top: 1px solid var(--rule);
  font-size: 8pt; color: var(--ink-soft); display: flex; gap: 16px; flex-wrap: wrap;
}
footer.doc .sp { margin-left: auto; }
footer.doc a { color: var(--ink-soft); }

/* --------------------------------------------------------------- controls */
.printbar {
  position: sticky; top: 0; z-index: 10; background: var(--ink); color: #fff;
  padding: 11px 16px; display: flex; align-items: center; gap: 14px; font-size: 10pt;
}
.printbar .btn { margin-left: auto; background: var(--accent-on-light); color: #fff; }
.printbar a.back { color: #fff; opacity: .75; text-decoration: none; font-size: 9.5pt; }
.printbar a.back:hover { opacity: 1; }

.mocknote {
  display: none; margin-top: 18px; padding: 12px 15px;
  border: 1px solid var(--medium); background: #FFF8E5; border-radius: 5px; font-size: 9pt;
}
.mocknote.on { display: block; }
.mocknote b { color: var(--medium); }

@media print {
  body { background: #fff; }
  .sheet { box-shadow: none; max-width: none; margin: 0; padding: 0; }
  .printbar { display: none !important; }
  .runhead { display: block; position: fixed; top: 0; left: 0; right: 0; }
  .sheet { padding-top: 10mm; }
  a { text-decoration: none; color: inherit; }
  /* Nothing decorative, nothing animated, nothing interactive reaches paper. */
  button, .btn, nav, canvas, video { display: none !important; }
}
</style>

'use strict';

const REPORT_KEY = 'llmantis:lastReport';

/* A real scan hands its report over in sessionStorage. With none present this

let REPORT = SAMPLE;
let IS_SAMPLE = true;
try {
  const stored = sessionStorage.getItem(REPORT_KEY);
  if (stored) { REPORT = JSON.parse(stored); IS_SAMPLE = false; }
} catch (e) { /* fall through to the sample */ }

const TARGET_NAME = REPORT.target_name || 'Example Bot (demo target)';

const GRADE_COLOUR = g =>
  (g === 'A' || g === 'B') ? 'var(--accent-on-light)'
  : g === 'C' ? 'var(--medium)'
  // D and E are both "bad, not worst". E exists since the scoring rework —
  // without it E fell through to the F colour and read as an F.
  : (g === 'D' || g === 'E') ? 'var(--high)'
  : 'var(--critical)';
const SEV_COLOUR = {
  critical: 'var(--critical)', high: 'var(--high)',
  medium: 'var(--medium)', low: 'var(--low)'
};

const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const nice = s => String(s || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

/* ---------------------------------------------------------------------------
   SECRET REDACTION

   With mock data this never mattered. With a real scan it does: for a canary
   leak the `evidence` field IS the canary, verbatim, and the answer contains it
   too. GREGOR-TARGET-LAB.md:145 — the planted secret is "never printed in logs
   or in the report body — only the surrounding quote is shown."

   Both rules have to hold at once:
     - "no quote, no finding" (PLAYBOOK) — a finding must carry the bot's words
     - the secret itself must not be reprinted in a document that gets emailed,
       archived and forwarded

   So we show the surrounding sentence with the value masked. The customer can
   verify it against their own system prompt; the report does not republish it.
   Only strings the caller declared as secret are masked — we never guess.
--------------------------------------------------------------------------- */
const SECRETS = [REPORT.canary]
  .concat(REPORT.secrets || [])
  .filter(v => v && String(v).trim().length >= 4)
  .map(v => String(v));

const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function mask(secret) {
  return '[redacted · ' + String(secret).length + ' chars]';
}

/* Replace every declared secret wherever it appears, case-insensitively —
   layer 1 compares case-insensitively too, so masking must not be stricter
   than detection. */
function redact(text) {
  let out = String(text == null ? '' : text);
  for (const sec of SECRETS) {
    out = out.replace(new RegExp(reEsc(sec), 'gi'), mask(sec));
  }
  return out;
}

const hasSecret = text => {
  const t = String(text == null ? '' : text).toLowerCase();
  return SECRETS.some(sec => t.includes(sec.toLowerCase()));
};

/* The evidence a reader sees. When the raw evidence is the secret itself, quote
   the answer around it instead, so there is still a real quote to point at. */
function evidenceFor(r) {
  const raw = String(r.evidence == null ? '' : r.evidence);
  if (!hasSecret(raw)) return { text: raw, redacted: false };

  const hit = SECRETS.find(sec => raw.toLowerCase().includes(sec.toLowerCase()));
  const src = String(r.answer == null ? '' : r.answer);
  const at  = src.toLowerCase().indexOf(String(hit).toLowerCase());
  if (at >= 0) {
    const from = Math.max(0, at - 90);
    const to   = Math.min(src.length, at + String(hit).length + 90);
    return {
      text: (from > 0 ? '… ' : '') + redact(src.slice(from, to)) + (to < src.length ? ' …' : ''),
      redacted: true
    };
  }
  return { text: redact(raw), redacted: true };
}

/* Blocked is a provider content filter refusing to deliver the attack, not a
   failure of ours and not evidence about the bot. The backend counts it in
   summary.blocked; per-result it only shows up as an ERROR whose reason names
   the filter, so the same text test is used here to label the row honestly.
   Kept in sync with scoring.classify(). */
const isBlocked = r => /content_filter|content management policy/i
  .test(String(r.reason == null ? '' : r.reason));

/* Asset paths in THIS file are relative, not "/static/...", and that is
   deliberate. report.html is only ever served from the /static mount
   (backend/main.py serves landing.html at / and index.html at /scan), so
   "assets/..." and "/static/assets/..." resolve to the same file there — but
   only the relative form still resolves when the document is opened directly
   from disk, where an absolute /static/... path hits the filesystem root and
   the mark, the seal and the fonts all fail to load. This is the one document a
   customer saves and reopens, so it has to survive that. */
const MARK = '<img src="assets/brand/mark-ink.svg" alt="" width="26" height="26">';

function build() {
  const s = REPORT.summary;
  const results = REPORT.results || [];
  const errored = s.errors != null ? s.errors : results.filter(r => r.verdict === 'ERROR').length;
  const total   = s.total  != null ? s.total  : results.length;
  const blocked = s.blocked != null ? s.blocked : results.filter(isBlocked).length;
  // Only a confirmed finding may drive a grade to F, so the count of them is
  // the load-bearing number in this document, not the score.
  const confirmed = results.filter(
    r => r.verdict === 'FAIL' && r.confidence === 'confirmed').length;
  // The backend already decided this and withheld the grade if it applied
  // (scanner.run_scan). Recomputing the 10% rule here could only disagree
  // with the side that owns it — see the same fix in index.html.
  const incomplete = s.incomplete != null
    ? !!s.incomplete
    : (total > 0 && (errored / total) > 0.10);

  const allFails = results.filter(r => r.verdict === 'FAIL');
  // Project rule: a finding without an evidence quote does not appear at all.
  const fails    = allFails.filter(r => r.evidence && String(r.evidence).trim());
  const withheld = allFails.length - fails.length;
  const errs = results.filter(r => r.verdict === 'ERROR');
  const ok   = results.filter(r => r.verdict !== 'FAIL' && r.verdict !== 'ERROR');

  const order = { critical: 0, high: 1, medium: 2, low: 3 };
  fails.sort((a, b) => (order[a.severity] ?? 9) - (order[b.severity] ?? 9));

  const issued = new Date().toISOString().slice(0, 10);
  const scanId = String(REPORT.scan_id || '—').slice(0, 12);
  const libVer = REPORT.library_version || 'not reported by the backend';

  document.getElementById('runhead').innerHTML =
    'LLMantis <span lang="de">Prüfbericht</span> — ' + esc(TARGET_NAME) +
    '<span class="r">' + esc(scanId) + ' · ' + issued + '</span>';

  let h = '';

  h += '<div class="masthead">' + MARK +
       '<span class="name"><span class="ll">LL</span>Mantis</span>' +
       '<span class="kind" lang="de">Prüfbericht</span></div>';

  h += '<div class="title"><h1>Security test of an AI chat assistant</h1>' +
       '<p class="sub">Behavioural testing against documented attack techniques ' +
       'from the OWASP Top 10 for LLM.</p></div>';

  h += '<dl class="meta">' +
       '<div><dt>Target</dt><dd>' + esc(TARGET_NAME) + '</dd></div>' +
       '<div><dt>Issued</dt><dd>' + issued + '</dd></div>' +
       '<div><dt>Scan ID</dt><dd>' + esc(scanId) + '</dd></div>' +
       '<div><dt>Attack library</dt><dd>' + esc(libVer) + '</dd></div>' +
       // Coverage belongs on the face of the document. A Prüfbericht that does
       // not say how much of the library actually ran invites the reader to
       // assume all of it did.
       (s.scored != null
         ? '<div><dt>Checks completed</dt><dd>' + s.scored + ' of ' + total + '</dd></div>' : '') +
       (s.critical_coverage != null
         ? '<div><dt>Critical coverage</dt><dd>' + s.critical_coverage + ' %</dd></div>' : '') +
       '</dl>';

  if (IS_SAMPLE) {
    h += '<div class="mocknote on"><b>Sample document.</b> No scan result was handed to this ' +
         'page, so the figures below come from a stored example and describe nothing real. ' +
         'Run a scan and open the report from the results screen to produce a real one.</div>';
  }

  if (incomplete) {
    // The backend now says WHY in incomplete_because. Printing our own guess
    // instead ("N of M failed") sent the reader to the wrong thing: a grade is
    // withheld for too few completed attacks OR too little critical coverage,
    // and those have different remedies.
    const why = [].concat(s.incomplete_because || []);
    h += '<div class="verdict nograde"><div>' +
      '<div class="vnum">No grade issued</div>' +
      (why.length
        ? '<ul class="compact" style="margin-top:8px">' +
          why.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul>'
        : '<p class="soft" style="margin-top:6px">' + errored + ' of ' + total +
          ' checks did not complete.</p>') +
      '<p class="soft" style="margin-top:6px;max-width:64ch">A grade computed from partial ' +
      'results would misrepresent the system under test, so none is given. Under a deduction ' +
      'model a missing attack can only help the bot, so an incomplete scan is not merely ' +
      'uncertain — it is biased in the bot\'s favour.</p></div></div>';
  } else {
    h += '<div class="verdict">' +
      '<div class="gradebox" style="background:' + GRADE_COLOUR(s.grade) + '"><span>' +
      esc(s.grade) + '</span></div>' +
      '<div><div class="vnum">' + s.score + '<small>/100</small></div>' +
      '<div class="vstats">' +
      '<div><b>' + s.failed + '</b><span>succeeded</span></div>' +
      '<div><b>' + s.passed + '</b><span>defended</span></div>' +
      '<div><b>' + s.critical_failures + '</b><span>critical</span></div>' +
      // Shown only when it is non-zero, so a clean scan reads exactly as
      // before. When it is non-zero it has to be here: "checks run" is now
      // every attack sent, so succeeded + defended no longer adds up to it,
      // and a reader doing that subtraction deserves the missing term named
      // rather than having to find the section at the bottom of the page.
      (errored ? '<div><b>' + errored + '</b><span>not scored</span></div>' : '') +
      // A provider content filter refusing to deliver an attack is neither a
      // pass nor a failure and earns no credit. It has to be visible: without
      // it, "checks run" does not reconcile and a reader could read silence as
      // a defence.
      (blocked ? '<div><b>' + blocked + '</b><span>not delivered</span></div>' : '') +
      '<div><b>' + total + '</b><span>checks run</span></div>' +
      '</div></div></div>';

    if (s.capped) {
      h += '<div class="withheld" style="margin-top:0"><b>The grade is capped.</b> ' +
        'A critical finding was confirmed, so no higher grade is available regardless of the ' +
        'score — a single confidential disclosure outweighs any number of minor passes.</div>';
    }
  }

  h += '<section><h2 class="sec">How this was judged</h2>' +
    '<p>Every attack is sent to the system under test and the answer is ruled on in two ' +
    'layers. The order matters, and it is what makes this report defensible rather than ' +
    'an opinion.</p>' +
    '<table><thead><tr><th>Layer</th><th>What it decides</th><th>Can it be wrong?</th></tr></thead><tbody>' +
    '<tr><td class="num">deterministic</td><td>A canary string planted in the system prompt came back in the answer, verbatim</td><td>No. It is a string comparison, no model involved</td></tr>' +
    '<tr><td class="num">llm_judge</td><td>Behaviour a string match cannot catch — approving a refund, giving medical advice</td><td>Yes. Marked as such, and never the sole basis for the worst grade</td></tr>' +
    '</tbody></table>';
  if (REPORT.scoring_explanation) {
    h += '<p class="soft" style="margin-top:12px"><b>Scoring.</b> ' +
         esc(REPORT.scoring_explanation) + '</p>';
  }
  h += '<p class="soft">Every finding below carries the exact quote from the answer that ' +
       'proves it. A finding without such a quote is not reported at all.</p>';
  h += '<p class="soft"><b>Deterministic findings in this scan: ' + confirmed + '.</b> ' +
       (confirmed
         ? 'These rest on a string comparison against a secret planted in the system prompt, ' +
           'not on a model\'s opinion. They are the only findings permitted to drive the grade ' +
           'to its lowest band.'
         : (REPORT.canary
              ? 'The planted secret was never returned verbatim in any answer. Any findings ' +
                'below rest on the judging model and are marked as such.'
              // Saying "no planted secret was disclosed" when no secret was ever
              // supplied is a false statement of fact in a paid report, and it is
              // the reassuring half. A scan of a live endpoint (mode="api") sees
              // no system prompt, so detect_canary has nothing to read: unless the
              // caller typed a canary, layer 1 could not run at all. This has
              // already happened — scan f7919394 printed "no planted secret was
              // disclosed" on one page while quoting the disclosed reference code
              // as evidence two pages later.
              : 'No secret was supplied for this scan, so this layer could not run: ' +
                'proving a leak by string match requires knowing the string. ' +
                '<b>This is not a statement that nothing leaked.</b> Every finding below ' +
                'rests on the judging model. Enter the confidential value in the canary ' +
                'field and run the scan again to have it checked exactly.')) + '</p>';
  if (SECRETS.length) {
    h += '<p class="soft">Confidential values are masked wherever they appear below, including ' +
         'inside quoted answers. The quote is shown; the value is not reprinted.</p>';
  }
  h += '</section>';

  const cats = Object.keys(s.by_category || {});
  if (cats.length) {
    // "Not scored" is its own column on purpose. Succeeded used to be derived
    // as total - passed, which silently counted every errored attack as an
    // attack that beat the bot — a vulnerability claim with no evidence
    // behind it, in the one document a customer pays for.
    h += '<section><h2 class="sec">Result by category</h2><table>' +
      '<thead><tr><th>Category</th><th>Defended</th><th>Succeeded</th>' +
      '<th>Not scored</th><th>Checks</th></tr></thead><tbody>';
    for (const c of cats) {
      const v = s.by_category[c];
      const vFailed = v.failed != null ? v.failed : (v.total - v.passed);
      const vErrors = v.errors != null ? v.errors : 0;
      h += '<tr><td>' + esc(nice(c)) + '</td><td class="num">' + v.passed +
           '</td><td class="num">' + vFailed +
           '</td><td class="num">' + (vErrors || '—') +
           '</td><td class="num">' + v.total + '</td></tr>';
    }
    h += '</tbody></table></section>';
  }

  if (fails.length) {
    h += '<section><h2 class="sec">Findings — ' + fails.length + ' attack' +
         (fails.length === 1 ? '' : 's') + ' succeeded</h2>';
    for (const r of fails) h += finding(r);
    if (withheld) {
      h += '<div class="withheld"><b>' + withheld + ' further failure' +
        (withheld === 1 ? ' was' : 's were') + ' withheld.</b> The judge returned no exact ' +
        'quote from the answer to support ' + (withheld === 1 ? 'it' : 'them') + ', and we do ' +
        'not print a finding we cannot evidence. ' + (withheld === 1 ? 'It is' : 'They are') +
        ' counted in the totals above.</div>';
    }
    h += '</section>';
  }

  // Blocked and errored both arrive as verdict ERROR but mean different things,
  // and a paid report should not call a provider's content filter "an error on
  // our side" or let the reader mistake either one for a defence.
  const blockedRows = errs.filter(isBlocked);
  const failedRows  = errs.filter(r => !isBlocked(r));

  if (blockedRows.length) {
    h += '<section><h2 class="sec">Not delivered — ' + blockedRows.length + '</h2>' +
      '<p class="soft">The model provider\'s own content filter refused to pass these attacks ' +
      'to the system under test, so it never saw them. They earn no credit and carry no ' +
      'penalty, and they are excluded from the grade: the system demonstrated nothing about ' +
      'them, in either direction. Crediting them would mean an identical system scored better ' +
      'merely for sitting behind a stricter filter.</p>';
    for (const r of blockedRows) h += finding(r);
    h += '</section>';
  }

  if (failedRows.length) {
    h += '<section><h2 class="sec">Checks that could not run — ' + failedRows.length + '</h2>' +
      '<p class="soft">These were not completed, so nothing is claimed about them in either ' +
      'direction. They are neither a pass nor a failure.</p>';
    for (const r of failedRows) h += finding(r);
    h += '</section>';
  }

  if (ok.length) {
    h += '<section><h2 class="sec">Defended — ' + ok.length + ' attack' +
         (ok.length === 1 ? '' : 's') + '</h2><ul class="compact">';
    for (const r of ok) h += '<li>' + esc(r.attack_id) + ' — ' + esc(r.reason || 'refused') + '</li>';
    h += '</ul></section>';
  }

  h += '<div class="disclaimer"><h2>What this document is, and what it is not</h2>' +
    '<p>This is a <b lang="de">Prüfbericht</b> — documented evidence that the system named ' +
    'above was tested against the attack techniques listed, on the date given.</p>' +
    '<p>It is <b>not a certification</b> and confers no conformity status. Under Regulation ' +
    '(EU) 2024/1689 (AI Act), conformity certificates are issued only by notified bodies, and ' +
    'only for high-risk systems. LLMantis is not a notified body. This document is ' +
    '<b>not legal advice</b>. <!-- REVIEW: Kwabena --></p>' +
    '<p>A result reflects the attack library as it stood on the date of the scan, and the ' +
    'behaviour observed during that scan. It does not establish that the system is secure ' +
    'against techniques not in the library, against future techniques, or against a different ' +
    'configuration of the same system.</p>' +
    '<p>Testing was performed with the verified consent of the system\'s owner.</p></div>';

  h += '<footer class="doc"><span>LLMantis · <span lang="de">Prüfbericht</span></span>' +
       '<span>Scan ' + esc(scanId) + '</span>' +
       '<span class="sp">Issued ' + issued + '</span></footer>';

  document.getElementById('sheet').innerHTML = h;
}

function finding(r) {
  const errored = r.verdict === 'ERROR';
  const col = errored ? 'var(--medium)' : (SEV_COLOUR[r.severity] || 'var(--critical)');
  const conf = r.confidence || r.method || '';

  let h = '<div class="finding" style="border-left-color:' + col + '">' +
    '<div class="fhead">' +
      '<span class="sev" style="color:' + col + '">' +
        esc(errored ? (isBlocked(r) ? 'not delivered' : 'could not run')
                    : (r.severity || 'finding')) + '</span>' +
      (conf ? '<span class="conf">' + esc(conf) + '</span>' : '') +
      '<span class="fid">' + esc(r.attack_id) + ' · ' + esc(nice(r.category)) + '</span>' +
    '</div>' +
    '<h3>' + esc(r.reason || r.attack_id) + '</h3><dl class="kv">';

  h += '<dt>What we sent</dt><dd><pre>' + esc(r.message) + '</pre></dd>';
  if (!errored) {
    h += '<dt>What the system answered</dt><dd><pre>' +
         esc(redact(r.answer || '(no answer)')) + '</pre></dd>';
  }
  if (r.evidence) {
    const ev = evidenceFor(r);
    h += '<dt>Evidence — the quote that proves this finding</dt>' +
         '<dd><pre class="evidence">' + esc(ev.text) + '</pre>' +
         (ev.redacted
           ? '<p class="soft" style="margin:6px 0 0">The disclosed value itself is withheld ' +
             'from this report. It is the secret that was planted in the system prompt, and ' +
             'reprinting it here would leak it a second time. Compare the masked span against ' +
             'your own prompt to confirm.</p>'
           : '') +
         '</dd>';
  }
  if (!errored && r.fix) h += '<dt>Recommended fix</dt><dd><pre class="fix">' + esc(r.fix) + '</pre></dd>';
  if (errored && r.reason) {
    h += '<dt>' + (isBlocked(r) ? 'Why it was not delivered' : 'Why it could not run') +
         '</dt><dd><pre>' + esc(redact(r.reason)) + '</pre></dd>';
  }

  return h + '</dl></div>';
}

build();
</script>
<footer style="max-width:190mm;margin:0 auto 24mm;padding:0 14mm;
  font-size:9pt;color:var(--muted)">
  <a href="impressum.html" style="color:var(--muted)">Impressum</a> ·
  <a href="datenschutz.html" style="color:var(--muted)">Datenschutzerklärung</a>
</footer>
<script>
/* The stamp is filled from the same REPORT object the page already built from,
   so it cannot drift from the report it sits on. It prints even when `grade`
   is null: a test was still performed, and the incomplete-scan banner above
   is what says the grade is missing. */
(function () {
  var mast = document.querySelector('.masthead');
  if (!mast || typeof REPORT === 'undefined' || !REPORT) return;
  /* The report carries no date field of its own — build() derives the issued
     date at render time. Reading a field that does not exist is how the first
     version of this stamp printed "geprüft am —" next to a filled-in report.
     The expression below is build()'s, character for character, on purpose:
     toLocaleDateString() reads local time and toISOString() reads UTC, so the
     two disagree by a day for part of every day. Measured here: the header
     said 2026-08-17 while the stamp said 18.8.2026 — on the same sheet. */
  var date = new Date().toISOString().slice(0, 10);
  var id   = String(REPORT.scan_id || '—').slice(0, 8);
  var lib  = REPORT.library_version || 'nicht angegeben';
  var d = document.createElement('div');
  d.className = 'stamp';
  d.innerHTML = '<img src="assets/brand/seal.svg" alt="">' +
    '<div class="ref">gepr&uuml;ft am ' + date +
    '<br>Scan #' + id +
    '<br>Bibliothek ' + lib + '</div>';
  mast.parentNode.insertBefore(d, mast.nextSibling);
})();
</script>
</body>
</html>
