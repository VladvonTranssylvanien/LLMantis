/* aria-current on the section actually in view. */
const navLinks = [...document.querySelectorAll('.nav a.link')];
const ratios = new Map();
function syncCurrent() {
  let best = null, bestR = 0;
  ratios.forEach((r, id) => { if (r > bestR) { bestR = r; best = id; } });
  navLinks.forEach(a => {
    if (best && a.getAttribute('href') === '#' + best) a.setAttribute('aria-current', 'true');
    else a.removeAttribute('aria-current');
  });
}
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => ratios.set(en.target.id, en.intersectionRatio));
    syncCurrent();
  }, { threshold: [0, .25, .5, .75, 1], rootMargin: '-84px 0px -45% 0px' });
  navLinks.forEach(a => {
    const el = document.querySelector(a.getAttribute('href'));
    if (el) io.observe(el);
  });
}

/* ===========================================================================
   Der Kopf als neuronales Netz. Die Knoten werden zur Laufzeit aus dem echten
   Logo-Pfad abgetastet — die Grafik IST die Markengeometrie.
   =========================================================================== */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const HEAD  = 'M 50 29 C 44 27, 30 26, 18 27 C 12 27.5, 9 31, 10 37 C 12 51, 22 68, 34 78 C 38 82, 44 86, 50 87 C 56 86, 62 82, 66 78 C 78 68, 88 51, 90 37 C 91 31, 88 27.5, 82 27 C 70 26, 56 27, 50 29 Z M 18.5 31.28 a 14 8.5 50 1 0 18 21.44 a 14 8.5 50 1 0 -18 -21.44 Z M 63.5 52.72 a 14 8.5 -50 1 0 18 -21.44 a 14 8.5 -50 1 0 -18 21.44 Z';
const ANT_L = 'M 44 31 C 36 22, 24 12, 6 2 C 21 13, 34 24, 46.5 34.5 Z';
const ANT_R = 'M 56 31 C 64 22, 76 12, 94 2 C 79 13, 66 24, 53.5 34.5 Z';

const cv = $('#net'), ctx = cv.getContext('2d'), SIZE = 900;

const nodes = (function sample() {
  const off = document.createElement('canvas');
  off.width = off.height = SIZE;
  const o = off.getContext('2d');
  o.setTransform(SIZE / 100, 0, 0, SIZE / 100, 0, 0);
  o.fillStyle = '#fff';
  o.fill(new Path2D(HEAD), 'evenodd');
  o.fill(new Path2D(ANT_L));
  o.fill(new Path2D(ANT_R));
  const data = o.getImageData(0, 0, SIZE, SIZE).data;
  const pts = [], STEP = 15;
  for (let y = 0; y < SIZE; y += STEP)
    for (let x = 0; x < SIZE; x += STEP)
      if (data[(y * SIZE + x) * 4 + 3] > 128) {
        const jx = x + (Math.random() - .5) * STEP * 1.1;
        const jy = y + (Math.random() - .5) * STEP * 1.1;
        pts.push({ x: jx, y: jy, ox: jx, oy: jy, ph: Math.random() * 6.28,
                   sp: .4 + Math.random() * .7, r: Math.random() < .12 ? 2.6 : 1.35 });
      }
  return pts;
})();

// Kanten einmal berechnen. Nachbarschaftssuche pro Frame über ~900 Knoten ist
// genau das, was einen Laptop zum Schmelzen bringt.
const EDGE_MAX = 34, edges = [];
for (let i = 0; i < nodes.length; i++)
  for (let j = i + 1; j < nodes.length; j++) {
    const dx = nodes[i].ox - nodes[j].ox, dy = nodes[i].oy - nodes[j].oy;
    const d2 = dx * dx + dy * dy;
    if (d2 < EDGE_MAX * EDGE_MAX) edges.push({ a: i, b: j, d: Math.sqrt(d2) });
  }

const pulses = [];
const spawnPulse = () => edges.length &&
  pulses.push({ e: edges[(Math.random() * edges.length) | 0], t: 0, sp: .012 + Math.random() * .02 });
for (let i = 0; i < 26; i++) spawnPulse();

let netT = 0;
function drawNet() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  netT += 0.01;
  if (!REDUCED) for (const n of nodes) {
    n.x = n.ox + Math.sin(netT * n.sp + n.ph) * 3.4;
    n.y = n.oy + Math.cos(netT * n.sp * .85 + n.ph) * 3.4;
  }
  ctx.lineWidth = 1;
  for (const e of edges) {
    const a = nodes[e.a], b = nodes[e.b];
    ctx.strokeStyle = 'rgba(123, 227, 63, ' + ((1 - e.d / EDGE_MAX) * .3).toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const n of nodes) {
    ctx.fillStyle = n.r > 2 ? 'rgba(160, 240, 110, .95)' : 'rgba(123, 227, 63, .5)';
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.284); ctx.fill();
  }
  if (!REDUCED) for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.sp;
    if (p.t >= 1) { pulses.splice(i, 1); spawnPulse(); continue; }
    const a = nodes[p.e.a], b = nodes[p.e.b];
    ctx.fillStyle = 'rgba(200, 255, 160, ' + (Math.sin(p.t * Math.PI) * .95).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(a.x + (b.x - a.x) * p.t, a.y + (b.y - a.y) * p.t, 2.4, 0, 6.284);
    ctx.fill();
  }
}

/* ===========================================================================
   Der Prüfablauf, schematisch. Fünf Stufen, SVG, kein Fremdcode.
   Läuft nicht, wenn der Tab verborgen ist oder die Sektion aus dem Bild
   gescrollt wurde — eine Endlosschleife auf einer Marketingseite ist ein
   Batteriefehler. Pausierbar: WCAG 2.2.2.
   =========================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
const pipe = $('#pipe');
const STAGES = [
  { x: 60,  label: S.stage1, sub: S.stage1sub },
  { x: 250, label: S.stage2, sub: S.stage2sub },
  { x: 440, label: S.stage3, sub: S.stage3sub },
  { x: 630, label: S.stage4, sub: S.stage4sub },
  { x: 830, label: S.stage5, sub: S.stage5sub }
];

function el(tag, attrs, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

(function buildPipe() {
  // Verbindungen
  for (let i = 0; i < STAGES.length - 1; i++) {
    pipe.appendChild(el('line', {
      x1: STAGES[i].x + 42, y1: 86, x2: STAGES[i + 1].x - 42, y2: 86,
      stroke: 'var(--border)', 'stroke-width': 2, id: 'link' + i
    }));
  }
  STAGES.forEach((s, i) => {
    const g = el('g', { id: 'stage' + i });
    g.appendChild(el('rect', {
      x: s.x - 42, y: 58, width: 84, height: 56, rx: 10,
      fill: 'var(--surface)', stroke: 'var(--border)', 'stroke-width': 1.5, id: 'box' + i
    }));
    g.appendChild(el('text', {
      x: s.x, y: 82, 'text-anchor': 'middle', fill: 'var(--text)',
      'font-size': 13, 'font-weight': 600, 'font-family': 'var(--sans)'
    }, s.label));
    g.appendChild(el('text', {
      x: s.x, y: 100, 'text-anchor': 'middle', fill: 'var(--muted)',
      'font-size': 10.5, 'font-family': 'var(--mono)', id: 'sub' + i
    }, s.sub));
    pipe.appendChild(g);
  });
  // Zwei Bewertungsebenen unter Stufe 4
  pipe.appendChild(el('text', {
    x: STAGES[3].x, y: 138, 'text-anchor': 'middle', fill: 'var(--muted)',
    'font-size': 10, 'font-family': 'var(--mono)', id: 'lay1'
  }, S.layer1));
  pipe.appendChild(el('text', {
    x: STAGES[3].x, y: 154, 'text-anchor': 'middle', fill: 'var(--muted)',
    'font-size': 10, 'font-family': 'var(--mono)', id: 'lay2'
  }, S.layer2));
  // Das wandernde Paket
  pipe.appendChild(el('circle', { cx: -20, cy: 86, r: 6, fill: 'var(--accent)', id: 'packet' }));
  // Note am Ende
  pipe.appendChild(el('text', {
    x: STAGES[4].x, y: 40, 'text-anchor': 'middle', fill: 'var(--accent)',
    'font-size': 22, 'font-weight': 700, 'font-family': 'var(--sans)', id: 'gradeOut', opacity: 0
  }, 'B'));
})();

const packet = pipe.querySelector('#packet');
const gradeOut = pipe.querySelector('#gradeOut');
const toggle = $('#pipeToggle');
const countEl = $('#pipeCount');

function setStage(active) {
  STAGES.forEach((s, i) => {
    const box = pipe.querySelector('#box' + i);
    box.setAttribute('stroke', i === active ? 'var(--accent)' : 'var(--border)');
    box.setAttribute('fill', i === active ? 'var(--surface-2)' : 'var(--surface)');
  });
  pipe.querySelector('#lay1').setAttribute('fill', active === 3 ? 'var(--accent)' : 'var(--muted)');
  pipe.querySelector('#lay2').setAttribute('fill', active === 3 ? 'var(--medium)' : 'var(--muted)');
}

/* Statische Fassung: dieselben fünf Stufen, kein Frame, kein Timer. */
function renderStatic() {
  setStage(-1);
  STAGES.forEach((s, i) => { pipe.querySelector('#sub' + i).textContent = s.sub; });
  packet.setAttribute('opacity', 0);
  gradeOut.setAttribute('opacity', 1);
  countEl.textContent = '75 / 75';
  toggle.hidden = true;
}

let running = false, t0 = 0, rafId = 0;
const CYCLE = 9000;

function frame(now) {
  if (!running) return;
  if (!t0) t0 = now;
  const p = ((now - t0) % CYCLE) / CYCLE;

  const seg = Math.min(4, Math.floor(p * 5));
  setStage(seg);

  const local = (p * 5) - seg;
  const from = STAGES[Math.max(0, seg)].x;
  const to   = STAGES[Math.min(4, seg + 1)].x;
  packet.setAttribute('cx', from + (to - from) * local);
  packet.setAttribute('opacity', seg >= 4 ? 0 : 1);

  const n = Math.min(75, Math.round(p * 75) + 1);
  countEl.textContent = n + ' / 75';
  pipe.querySelector('#sub1').textContent = 'Angriff ' + n + ' von 75';
  gradeOut.setAttribute('opacity', seg >= 4 ? String(Math.min(1, (local * 2))) : '0');

  drawNet();
  rafId = requestAnimationFrame(frame);
}

function start() {
  if (running || REDUCED) return;
  running = true; t0 = 0;
  toggle.textContent = S.pipePause;
  toggle.setAttribute('aria-pressed', 'false');
  rafId = requestAnimationFrame(frame);
}
function stop() {
  running = false;
  cancelAnimationFrame(rafId);
  toggle.textContent = S.pipePlay;
  toggle.setAttribute('aria-pressed', 'true');
}

let userPaused = false;
let inView = false;
toggle.addEventListener('click', () => {
  userPaused = running;
  if (running) stop(); else start();
});

// Nicht laufen, wenn der Tab verborgen ist.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(rafId); running = false; }
  else if (!userPaused && inView) start();
});

// Nicht laufen, wenn die Sektion aus dem Bild ist.
if ('IntersectionObserver' in window) {
  new IntersectionObserver(es => {
    inView = es[0].isIntersecting;
    if (inView && !userPaused && !document.hidden) start(); else if (!inView) stop();
  }, { threshold: .15 }).observe($('#produkt'));
} else { inView = true; }

if (REDUCED) { renderStatic(); drawNet(); }
else { toggle.textContent = S.pipePause; start(); }
</script>
