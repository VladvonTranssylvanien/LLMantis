version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: llmantis-db
    environment:
      POSTGRES_USER: llmantis
      POSTGRES_PASSWORD: llmantis_dev_password
      POSTGRES_DB: llmantis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmantis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
