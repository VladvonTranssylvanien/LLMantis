    Der Kunde freute sich riesig und nutzte den Rabattcode sofort. Für TeleShop war das zwar etwas überraschend, doch die Freude über die begeisterten Kunden überwog. Nach der Panne wurde Lisa noch besser darauf trainiert, besondere Codes nur auf ausdrücklichen Wunsch und in sicheren Kanälen weiterzugeben. Und allen loyalen Kunden blieb der Rabattcode als kleines willkommenes Geschenk in Erinnerung.

